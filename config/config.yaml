# Trading system configuration
# Secrets (MT5 credentials, Telegram token) go in .env only — not here.

phase_current: 0      # 0=define | 1=backtest | 2=demo+alerts | 3=semi-auto | 4=live
demo_mode: true       # stays true until explicit written instruction from Ibrahim

# Symbols — XAUUSD is the ONLY active symbol in Phase 0-1.
# Uncomment next symbol only after the current one passes its full gate.
symbols_active:
  - XAUUSD
symbols_queued:
  # - EURUSD
  # - GBPJPY
  # - USDCAD
  # - BTCUSD
  # - ETHUSD

# MT5 symbol suffix (Exness sometimes appends 'm' — confirm in MT5 terminal)
mt5_symbol_suffix: ""   # e.g. "" or "m"

risk:
  per_trade_pct: 0.01        # 1% default
  max_per_trade_pct: 0.02    # hard cap — never exceed
  max_concurrent_pct: 0.06   # total open risk across all trades
  daily_loss_kill_pct: 0.04  # halt trading today after -4% realized loss
  kelly_fraction: 0.25       # quarter-Kelly max; only use after 100+ real trades

strategy:
  XAUUSD:
    name: xauusd_trend_pull_v1
    timeframe_entry: M60      # 1H bars
    timeframe_context: H4     # 4H trend filter
    atr_sl_multiplier: 1.5    # SL = 1.5 × ATR(14)
    rr_target: 2.5            # TP = entry ± (SL_dist × 2.5)
    min_atr: 3.0              # skip if ATR(14) < 3.0 USD (dead market)
    rsi_pullback_threshold: 45
    rsi_momentum_threshold: 50
    pullback_lookback: 3      # look 3 bars back for the RSI dip

sessions:
  # UTC — adjust for DST; London/NY only, no Asian/rollover by default
  open_utc: "07:00"
  close_utc: "17:00"

news_filter:
  enabled: true
  block_before_min: 15
  block_after_min: 15
  # High-impact events to block — extend as needed
  keywords:
    - CPI
    - FOMC
    - NFP
    - NonFarm
    - rate_decision
    - interest_rate
    - PMI_flash
    - GDP_flash
